name: Validate

on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  tests:
    name: Tests and static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        run: python -m pip install --upgrade pip -r requirements_test.txt

      - name: Compile integration
        run: python -m compileall -q custom_components/facebox scripts

      - name: Run pyflakes
        run: pyflakes custom_components/facebox tests scripts

      - name: Run tests
        run: pytest -q

  hassfest:
    name: Home Assistant hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate integration with hassfest
        run: |
          docker pull ghcr.io/home-assistant/hassfest
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/github/workspace" \
            ghcr.io/home-assistant/hassfest

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository with base history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether default branch can be validated by HACS
        id: base
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags origin "$GITHUB_BASE_REF"

          if ! git cat-file -e "origin/$GITHUB_BASE_REF:custom_components/facebox/manifest.json" 2>/dev/null \
             || ! git cat-file -e "origin/$GITHUB_BASE_REF:hacs.json" 2>/dev/null; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Bootstrap PR: HACS validates the repository default branch, which is not HACS-ready until this PR is merged."
            exit 0
          fi

          if [[ -f custom_components/facebox/brand/icon.png ]] \
             && ! git cat-file -e "origin/$GITHUB_BASE_REF:custom_components/facebox/brand/icon.png" 2>/dev/null; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Brand bootstrap PR: HACS validates the default branch, so the new brand asset can only be validated after merge."
            exit 0
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Validate repository with HACS
        if: steps.base.outputs.ready == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HACS_IGNORE: ${{ github.event_name == 'pull_request' && 'topics license' || '' }}
        run: |
          docker pull ghcr.io/hacs/action:main
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/github/workspace" \
            -w /github/workspace \
            -e INPUT_CATEGORY=integration \
            -e INPUT_IGNORE="$HACS_IGNORE" \
            -e INPUT_COMMENT=false \
            -e INPUT_REPOSITORY="$GITHUB_REPOSITORY" \
            -e INPUT_GITHUB_TOKEN="$GITHUB_TOKEN" \
            -e GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            -e GITHUB_REF="$GITHUB_REF" \
            -e GITHUB_REF_NAME="$GITHUB_REF_NAME" \
            -e GITHUB_HEAD_REF="$GITHUB_HEAD_REF" \
            -e GITHUB_BASE_REF="$GITHUB_BASE_REF" \
            -e GITHUB_SHA="$GITHUB_SHA" \
            -e GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" \
            -e GITHUB_EVENT_PATH="$GITHUB_EVENT_PATH" \
            -e GITHUB_WORKSPACE=/github/workspace \
            ghcr.io/hacs/action:main

  version:
    name: Tag and manifest sync gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository with tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Verify manifest matches highest semantic Git tag
        run: |
          git fetch --force --tags origin
          python scripts/version.py check-manifest-current
          echo "Next automatic release: v$(python scripts/version.py next)"
